# docker-compose.yml
version: "3.3"
services:
  kriti_submission_backend:
    image: kriti_submission_backend
    container_name: kriti_submission_backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/usr/src/app/backend/uploads 

    ports:
      - "7081:3001"
    env_file:
      - .env
    networks:
      - backend_welfare-board-strapi


networks:
  backend_welfare-board-strapi:
    external: true